# Valle Verde server (RNF-15, RNF-16)

# The server only listens on this machine; port 0 picks a free one (Main reads the real port back)
server.address=127.0.0.1
server.port=0
spring.main.banner-mode=off
spring.jackson.deserialization.fail-on-unknown-properties=false

# MongoDB holds the saved games (RN-31). It is not needed to play: the client connects lazily and
# each operation gives up after 2 seconds. Override with the environment variable VALLEVERDE_MONGO_URI.
valleverde.mongo.uri=mongodb://localhost:27017/valleverde?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=2000
spring.data.mongodb.uri=${valleverde.mongo.uri}

# the MongoDB driver logs a stack trace at INFO every 10 s while no MongoDB runs; playing does not need it
logging.level.org.mongodb.driver=WARN
